<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>눈은안오고</title>
</head>
<body bgcolor="skyblue" text="white">
<!-- 
    body태그에 배경색과 글자색 속성값 주기
    배경색 속성이름 : bgcolor
    글자색 속성이름 : text    


-->
    
    
    
    <!-- 주석넣기 : ctrl + /
         HTML 구조 꺼내기 : ! + enter
         라이브 서버 실행 : Alt + L + O
                           우클릭 -> open with live server 클릭
    -->
    <h1 align="center" >비 개많이 내림ㅠ</h1>
    <!-- 
        1. HTML은 요소로 구성되어 있다.
        <H1> : 시작태그
        안녕하세요~! : 내용(cotent)
        </H1> : 종료태그
        <h1>안녕하세요~!</h1> : 요소(element)
        2.요소에 추가적인 내용을 담고 싶으면 속성(attribute)을 사용한다.
        -> 속성의 위치 : 시작태그 안,태그 이름 뒤에 작성
        -> 정렬="가운데" 색깔="하늘색"
        -> <시작태그이름 속성1="값1" 속성2="값2">
    -->
</body>
</html>
